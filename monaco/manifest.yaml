manifestVersion: 1.0
projects:
  - name: bizevents
  - name: bizflow
  - name: oneagent-features
environmentGroups:
  - name: development
    environments:
      - name: dev
        url:
          type: environment
          value: TENANT_URL
        auth:
          token:
            type: environment
            name: TENANT_TOKEN
          oAuth:
            clientId:
              type: environment
              name: CLIENT_ID
            clientSecret:
              type: environment
              name: CLIENT_SECRET
