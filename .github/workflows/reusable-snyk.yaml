name: Snyk vulnerability scan
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SNYK_API_TOKEN:
        required: true

jobs:
  snyk:
    name: Run Snyk vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      security-events: write
      contents: read
      actions: read
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_API_TOKEN }}
      SNYK_ORGANIZATION_ID: f3a1df84-8dcb-4a46-ac8c-9e699dbda79e
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "src/pricing-service/go.mod"

      - name: Restore .NET projects
        run: for PROJECT in $(find . -name *.csproj); do dotnet restore $PROJECT; done

      - name: Install protoc and Go plugins
        run: |
          sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate protobuf code for Go services
        run: make generate-proto service="background-service db-adapter pricing-service user-service"

      - name: Run Snyk test
        run: snyk test --all-projects --severity-threshold=high

      - name: Run Snyk monitor
        if: github.ref_name == 'main'
        run: >
          snyk monitor
          --all-projects
          --target-reference=main
          --project-environment=external
          --project-lifecycle=sandbox
          --project-business-criticality=low
          --project-tags=team=team-demoability
