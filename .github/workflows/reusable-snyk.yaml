name: Snyk vulnerability scan
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SNYK_API_TOKEN:
        required: true
      SNYK_ORGANIZATION_ID:
        required: true

jobs:
  snyk:
    name: Run Snyk vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      security-events: write
      contents: read
      actions: read
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_API_TOKEN }}
      SNYK_ORGANIZATION_ID: ${{ secrets.SNYK_ORGANIZATION_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "src/pricing-service/go.mod"

      - name: Restore .NET projects
        run: for PROJECT in $(find . -name *.csproj); do dotnet restore $PROJECT; done

      - name: Install protobuf tooling
        run: make install-proto-tools

      - name: Generate protobuf code
        run: make generate-proto

      - name: Run Snyk test
        run: snyk test --all-projects --severity-threshold=high

      - name: Run Snyk monitor
        if: >-
          github.ref_name == 'main'
          || github.ref_name == 'refactor/build-pr-workflow'
          || github.head_ref == 'refactor/build-pr-workflow'
        run: snyk monitor --all-projects --target-reference=main
