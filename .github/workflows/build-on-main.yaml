name: Build and push easytrade
on:
  push:
    branches:
      - "main"
    paths:
      - .github/**
      - kubernetes-manifests/**
      - skaffold.yaml
      - src/**
      - helm/**
  workflow_dispatch:

  workflow_call:
    secrets:
      GAR_CREDENTIALS:
        required: true
      KUBECONFIG:
        required: true
      OQR_CLIENT_ID:
        required: true
      OQR_CLIENT_SECRET:
        required: true
      OQR_URL:
        required: true
      SNYK_API_TOKEN:
        required: true
      SSH_PRIVATE_KEY:
        required: true
      SSO_URL:
        required: true

env:
  NAMESPACE: easytrade
  CONTAINER_REGISTRY: europe-docker.pkg.dev/dynatrace-demoability/docker/easytrade
  HELM_REGISTRY: oci://europe-docker.pkg.dev/dynatrace-demoability/helm
  HELM_CHART_PATH: helm/easytrade

jobs:
  snyk:
    uses: ./.github/workflows/reusable-snyk.yaml
    permissions:
      security-events: write
      contents: read
      actions: read
    secrets:
      SNYK_API_TOKEN: ${{ secrets.SNYK_API_TOKEN }}

  calc-version:
    uses: ./.github/workflows/reusable-calc-version.yaml

  list-services:
    runs-on: ubuntu-24.04
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: List buildable services
        id: list
        uses: ./.github/actions/list-build-services

  build-push-image:
    if: needs.calc-version.outputs.already-released == 'false'
    needs:
      - calc-version
      - list-services
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.list-services.outputs.services) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set application version
        uses: ./.github/actions/set-version
        with:
          version: ${{ needs.calc-version.outputs.version }}

      - name: Build and push ${{ matrix.service }}
        uses: ./.github/actions/build-push-images
        env:
          GAR_CREDENTIALS: ${{ secrets.GAR_CREDENTIALS }}
        with:
          push: true
          push-latest: ${{ needs.calc-version.outputs.is-release }}
          tag: ${{ needs.calc-version.outputs.version }}
          registry: ${{ env.CONTAINER_REGISTRY }}
          service: ${{ matrix.service }}

  build-push-helm:
    if: needs.calc-version.outputs.already-released == 'false'
    runs-on: ubuntu-24.04
    needs: calc-version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build and push Helm chart
        uses: ./.github/actions/build-push-helm
        with:
          chart-path: ${{ env.HELM_CHART_PATH }}
          push: true
          registry-url: ${{ env.HELM_REGISTRY }}
          version: ${{ needs.calc-version.outputs.version }}
          credentials: ${{ secrets.GAR_CREDENTIALS }}

  build-artifact:
    if: needs.calc-version.outputs.already-released == 'false'
    runs-on: ubuntu-24.04
    needs:
      - calc-version
      - build-push-image
    outputs:
      artifact-dir: ${{ steps.artifact.outputs.artifact-dir }}
      artifact-name: ${{ steps.artifact.outputs.artifact-name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build release artifact
        id: artifact
        uses: ./.github/actions/build-artifact
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          tag: ${{ needs.calc-version.outputs.version }}

  promote:
    if: needs.calc-version.outputs.is-release == 'true'
    needs:
      - calc-version
      - build-push-image
      - build-push-helm
      - build-artifact
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/reusable-promote-release.yaml
    with:
      version: ${{ needs.calc-version.outputs.version }}
      trigger-deploy: false
      artifact-name: ${{ needs.build-artifact.outputs.artifact-name }}
      artifact-dir: ${{ needs.build-artifact.outputs.artifact-dir }}
