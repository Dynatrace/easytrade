name: Calculate Version
on:
  workflow_call:
    inputs:
      release-branch:
        description: "Branch name that triggers releases"
        required: false
        type: string
        default: "main"
    outputs:
      version:
        description: "Calculated semantic version"
        value: ${{ jobs.calc-version.outputs.version }}
      is-release:
        description: "Whether this is a release build"
        value: ${{ jobs.calc-version.outputs.is-release }}
      already-released:
        description: "DEPRECATED, use skip-build. Whether this version has already been released."
        value: ${{ jobs.calc-version.outputs.already-released }}
      skip-build:
        description: "true when build/publish/release must be skipped (version already released, or push commit message has '+semver: skip|none')"
        value: ${{ jobs.calc-version.outputs.skip-build }}

jobs:
  calc-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      is-release: ${{ steps.version.outputs.is-release }}
      already-released: ${{ steps.version.outputs.already-released }}
      skip-build: ${{ steps.version.outputs.skip-build }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        uses: Dynatrace/opentelemetry-demo/.github/actions/calc-version@main
        with:
          release-branch: ${{ inputs.release-branch }}
