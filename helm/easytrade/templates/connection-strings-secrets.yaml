{{- $db := .Values.global.database }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-connection-strings
  labels:
    {{- include "easytrade.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if eq $db.type "postgres" }}
  DB_URL: {{ printf "postgres://postgres:%s@%s-db-postgres:5432/%s?sslmode=disable" ($db.password | urlquery) .Release.Name $db.name | quote }}
  {{- else }}
  DB_URL: {{ printf "sqlserver://sa:%s@%s-db-mssql:1433?database=%s&encrypt=disable" ($db.password | urlquery) .Release.Name $db.name | quote }}
  {{- end }}