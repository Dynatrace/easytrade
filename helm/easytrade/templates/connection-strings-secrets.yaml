{{- $db := .Values.global.database }}
{{- $password := $db.password }}
{{- if $db.existingSecret.name }}
{{- $secret := lookup "v1" "Secret" .Release.Namespace $db.existingSecret.name }}
{{- if $secret }}
{{- $password = index $secret.data ($db.existingSecret.key | default "password") | b64dec }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-connection-strings
  labels:
    {{- include "easytrade.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if eq $db.type "postgres" }}
  DB_URL: {{ printf "postgres://postgres:%s@%s-db-postgres:5432/%s?sslmode=disable" ($password | urlquery) .Release.Name $db.name | quote }}
  {{- else }}
  DB_URL: {{ printf "sqlserver://sa:%s@%s-db-mssql:1433?database=%s&encrypt=disable" ($password | urlquery) .Release.Name $db.name | quote }}
  {{- end }}