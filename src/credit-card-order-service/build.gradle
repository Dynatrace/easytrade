plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.ben-manes.versions' version '0.66.0'
    id 'com.google.protobuf' version '0.10.0'
}

group = 'com.dynatrace.easytrade'
version = '1.0.0-easytrade'
java {
    java.sourceCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter-api:6.1.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-params:6.1.3'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.24.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-commons:6.1.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-engine:6.1.3'
    

    implementation 'org.springframework.boot:spring-boot-starter-web'

    // gRPC / protobuf
    implementation 'io.grpc:grpc-netty-shaded:1.85.1'
    implementation 'io.grpc:grpc-protobuf:1.85.1'
    implementation 'io.grpc:grpc-stub:1.85.1'
    implementation 'com.google.protobuf:protobuf-java:4.36.2'
    implementation 'com.google.protobuf:protobuf-java-util:4.36.2'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'

    //lombok
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    testCompileOnly 'org.projectlombok:lombok:1.18.48'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'

    //open feature
    implementation 'dev.openfeature:sdk:1.20.1'

    // -- not direct dependencies but need bumps to patch vulns
    // -- can be removed once the parent packages upgrade

    // https://mvnrepository.com/artifact/org.apache.commons/commons-lang3
    implementation 'org.apache.commons:commons-lang3:3.21.0'

	// Source: https://mvnrepository.com/artifact/com.google.guava/guava
	implementation 'com.google.guava:guava:33.7.2-jre'

	// Source: https://mvnrepository.com/artifact/ch.qos.logback/logback-core
	implementation 'ch.qos.logback:logback-core:1.6.6'
	implementation 'ch.qos.logback:logback-classic:1.6.6'

	// Source: https://mvnrepository.com/artifact/org.apache.logging.log4j/log4j-api
	implementation 'org.apache.logging.log4j:log4j-api:2.26.1'

    // Source: https://mvnrepository.com/artifact/tools.jackson.core/jackson-core
    implementation 'tools.jackson.core:jackson-core:3.2.4'

    // Source: https://mvnrepository.com/artifact/tools.jackson.core/jackson-databind
    implementation 'tools.jackson.core:jackson-databind:3.2.4'

    // Source: https://mvnrepository.com/artifact/tools.jackson.dataformat/jackson-dataformat-xml
    implementation 'tools.jackson.dataformat:jackson-dataformat-xml:3.2.4'

	// Source: https://mvnrepository.com/artifact/com.fasterxml.jackson.core/jackson-core
	implementation 'com.fasterxml.jackson.core:jackson-core:2.22.4'
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.4'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.22.4'
}

test {
    useJUnitPlatform()
}

def isNonStable = { String version ->
  def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { it -> version.toUpperCase().contains(it) }
  def regex = /^[0-9,.v-]+(-r)?$/
  return !stableKeyword && !(version ==~ regex)
}

// https://github.com/ben-manes/gradle-versions-plugin
tasks.named("dependencyUpdates").configure {
  rejectVersionIf {
    isNonStable(it.candidate.version)
  }
}

sourceSets {
    main {
        proto {
            srcDir '../proto'
            include 'common.proto'
            include 'credit_card_order_service.proto'
        }
    }
}

protobuf {
    protoc { artifact = 'com.google.protobuf:protoc:4.36.2' }
    plugins { grpc { artifact = 'io.grpc:protoc-gen-grpc-java:1.85.1' } }
    generateProtoTasks { all()*.plugins { grpc {} } }
}

