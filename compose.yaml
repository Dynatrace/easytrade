x-service: &default-service
  restart: always
  logging:
    driver: json-file
    options:
      max-file: "5"
      max-size: "10m"

x-addresses:
  offer-service: &offerServiceAddress "http://offerservice:8080"
  feature-flag-service: &featureFlagServiceAddress "http://feature-flag-service:8080"
  credit-card-order-service: &creditCardOrderServiceAddress "http://credit-card-order-service:8080"
  db-adapter: &dbAdapterAddress "db-adapter:50051"
  user-service: &userServiceAddress "http://user-service:8080"
  pricing-service: &pricingServiceAddress "http://pricing-service:8080"
  background-service: &backgroundServiceAddress "http://background-service:8080"
  easytrade-url: &easytradeUrl "http://frontendreverseproxy"

services:
  background-service:
    <<: *default-service
    image: ${REGISTRY}/background-service:${TAG}
    depends_on:
      - offerservice
    environment:
      OFFER_SERVICE_ADDRESS: *offerServiceAddress
      FEATURE_FLAG_SERVICE_ADDRESS: *featureFlagServiceAddress
      CREDIT_CARD_ORDER_SERVICE_ADDRESS: *creditCardOrderServiceAddress
      DB_ADAPTER_ADDRESS: *dbAdapterAddress
      THIRD_PARTY_DELAY: 10
      THIRD_PARTY_RATE: 10
      DELAY_CHANCE_PERCENT: 20

  broker-service:
    <<: *default-service
    image: ${REGISTRY}/broker-service:${TAG}
    depends_on:
      - db-adapter
      - user-service
      - pricing-service
      - feature-flag-service
    environment:
      USER_SERVICE_ADDRESS: *userServiceAddress
      PRICING_SERVICE_ADDRESS: *pricingServiceAddress
      FEATURE_FLAG_SERVICE_ADDRESS: *featureFlagServiceAddress
      PROXY_PREFIX: broker-service
      DB_ADAPTER_ADDRESS: *dbAdapterAddress

  credit-card-order-service:
    <<: *default-service
    image: ${REGISTRY}/credit-card-order-service:${TAG}
    depends_on:
      - db-adapter
      - background-service
    environment:
      PROXY_PREFIX: credit-card-order-service
      DB_ADAPTER_ADDRESS: *dbAdapterAddress
      THIRD_PARTY_SERVICE_ADDRESS: *backgroundServiceAddress
      FEATURE_FLAG_SERVICE_ADDRESS: *featureFlagServiceAddress
      WORK_DELAY: 300
      WORK_RATE: 900
      JAVA_TOOL_OPTIONS: "-XX:-OmitStackTraceInFastThrow"

  db:
    <<: *default-service
    image: ${REGISTRY}/db-${DB_TYPE}:${TAG}
    environment:
      SA_PASSWORD: ${DB_PASSWORD}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

  db-adapter:
    <<: *default-service
    build:
      context: src/
      dockerfile: db-adapter/Dockerfile
    depends_on:
      - db
    ports:
      - 50051:50051
    environment:
      DB_TYPE: ${DB_TYPE}
      DB_URL: ${DB_URL}

  feature-flag-service:
    <<: *default-service
    image: ${REGISTRY}/feature-flag-service:${TAG}
    environment:
      PROXY_PREFIX: feature-flag-service

  frontend:
    <<: *default-service
    image: ${REGISTRY}/frontend:${TAG}
    depends_on:
      - broker-service
      - user-service
      - pricing-service
      - credit-card-order-service

  frontendreverseproxy:
    <<: *default-service
    image: ${REGISTRY}/frontendreverseproxy:${TAG}
    depends_on:
      - broker-service
      - frontend
      - user-service
      - pricing-service
      - feature-flag-service
      - offerservice
      - credit-card-order-service
      - background-service
    ports:
      - 80:80

  loadgen:
    <<: *default-service
    image: ${REGISTRY}/loadgen:${TAG}
    depends_on:
      - frontendreverseproxy
    environment:
      EASYTRADE_URL: *easytradeUrl

  offerservice:
    <<: *default-service
    image: ${REGISTRY}/offerservice:${TAG}
    depends_on:
      - user-service
      - db-adapter
    environment:
      DB_ADAPTER_ADDRESS: *dbAdapterAddress
      USER_SERVICE_ADDRESS: *userServiceAddress
      FEATURE_FLAG_SERVICE_ADDRESS: *featureFlagServiceAddress

  pricing-service:
    <<: *default-service
    image: ${REGISTRY}/pricing-service:${TAG}
    depends_on:
      - db-adapter
    environment:
      DB_ADAPTER_ADDRESS: *dbAdapterAddress
      PROXY_PREFIX: pricing-service

  user-service:
    <<: *default-service
    image: ${REGISTRY}/user-service:${TAG}
    depends_on:
      - db-adapter
    environment:
      DB_ADAPTER_ADDRESS: *dbAdapterAddress
      PROXY_PREFIX: user-service
