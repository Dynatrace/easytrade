x-service: &default-service
  restart: always

x-feature-flag-service: &feature-flag-service-env
  FEATURE_FLAG_SERVICE_PROTOCOL: http
  FEATURE_FLAG_SERVICE_BASE_URL: feature-flag-service
  FEATURE_FLAG_SERVICE_PORT: 8080

x-connection-strings:
  JAVA_CONNECTION_STRING: &java-connection-string jdbc:sqlserver://db:1433;database=TradeManagement;user=sa;password=yourStrong(!)Password;encrypt=false;trustServerCertificate=false;loginTimeout=30;
  DOTNET_CONNECTION_STRING: &dotnet-connection-string Data Source=db;Initial Catalog=TradeManagement;Persist Security Info=True;User ID=sa;Password=yourStrong(!)Password;TrustServerCertificate=true
  GO_CONNECTION_STRING: &go-connection-string sqlserver://sa:yourStrong(!)Password@db:1433?database=TradeManagement&connection+encrypt=false&connection+TrustServerCertificate=false&connection+loginTimeout=30

services:
  db:
    <<: *default-service
    build: src/db/${DB_TYPE}
    ports:
      - 1433:1433
      - 5432:5432
    environment:
      SA_PASSWORD: ${DB_PASSWORD}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

  contentcreator:
    <<: *default-service
    build: src/contentcreator
    depends_on:
      - db
    environment:
      MSSQL_CONNECTIONSTRING: *java-connection-string

  manager:
    <<: *default-service
    build: src/manager/easyTradeManager
    depends_on:
      - db
    ports:
      - 8081:8080
    environment:
      MSSQL_CONNECTIONSTRING: *dotnet-connection-string
      PROXY_PREFIX: manager

  pricing-service:
    <<: *default-service
    build:
      context: src/
      dockerfile: pricing-service/Dockerfile
    depends_on:
      - db-adapter
    ports:
      - 8083:8080
    environment:
      DBADAPTER_HOSTANDPORT: db-adapter:50051
      PROXY_PREFIX: pricing-service

  broker-service:
    <<: *default-service
    build:
      context: src/
      dockerfile: broker-service/Dockerfile
    ports:
      - 8084:8080
    depends_on:
      - db-adapter
      - user-service
      - pricing-service
      - feature-flag-service
    environment:
      USER_SERVICE_HOSTANDPORT: user-service:8080
      PRICINGSERVICE_HOSTANDPORT: pricing-service:8080
      <<: *feature-flag-service-env
      PROXY_PREFIX: broker-service
      DBADAPTER_HOSTANDPORT: db-adapter:50051

  frontend:
    <<: *default-service
    build:
      context: src/frontend
      dockerfile: Dockerfile.dev
      # dockerfile: Dockerfile
    # depends_on:
    #   - broker-service
    #   - user-service
    #   - pricing-service
    #   - credit-card-order-service
    ports:
      - 8092:3000
    volumes:
      - ./src/frontend/src:/app/src:ro

  frontendreverseproxy:
    <<: *default-service
    build: src/frontendreverseproxy
    depends_on:
      - broker-service
      - frontend
      - pricing-service
      - feature-flag-service
      - offerservice
      - credit-card-order-service
      - third-party-service
      - user-service
    ports:
      - 80:80

  loadgen:
    <<: *default-service
    build: src/loadgen
    depends_on:
      - frontendreverseproxy
    environment:
      EASYTRADE_URL: http://frontendreverseproxy

  offerservice:
    <<: *default-service
    build:
      context: src/
      dockerfile: offerservice/Dockerfile
    depends_on:
      - db-adapter
      - user-service
      - feature-flag-service
    ports:
      - 8087:8080
    environment:
      <<: *feature-flag-service-env
      DBADAPTER_HOSTANDPORT: db-adapter:50051
      USER_SERVICE_PORT: 8080
      USER_SERVICE_BASE_URL: user-service

  user-service:
    <<: *default-service
    build: src/user-service
    ports:
      - 8089:8080
    environment:
      # db-adapter is not part of the compose stack yet; user-service is prepared to call it.
      DB_ADAPTER_ADDRESS: db-adapter:50051
      
  credit-card-order-service:
    <<: *default-service
    build:
      context: src/
      dockerfile: credit-card-order-service/Dockerfile
    depends_on:
      - db-adapter
      - third-party-service
    ports:
      - 8091:8080
    environment:
      PROXY_PREFIX: credit-card-order-service
      DBADAPTER_HOSTANDPORT: db-adapter:50051
      THIRD_PARTY_SERVICE_HOSTANDPORT: third-party-service:8080
      <<: *feature-flag-service-env
      WORK_DELAY: 30
      WORK_RATE: 30
      JAVA_TOOL_OPTIONS: "-XX:-OmitStackTraceInFastThrow"

  third-party-service:
    <<: *default-service
    build: src/third-party-service
    ports:
      - 8093:8080
    environment:
      <<: *feature-flag-service-env
      PROXY_PREFIX: third-party-service
      CREDIT_CARD_ORDER_SERVICE_HOSTANDPORT: credit-card-order-service:8080
      COURIER_DELAY: 10
      COURIER_RATE: 10
      MANUFACTURE_DELAY: 10
      MANUFACTURE_RATE: 10

  feature-flag-service:
    <<: *default-service
    build: src/feature-flag-service
    ports:
      - 8094:8080
    environment:
      PROXY_PREFIX: feature-flag-service
      # ENABLE_MODIFY: "false"
      # ENABLE_FRONTEND_MODIFY: "false"

  db-adapter:
    <<: *default-service
    build:
      context: src/
      dockerfile: db-adapter/Dockerfile
    depends_on:
      - db
    ports:
      - 50051:50051
    environment:
      DB_TYPE: ${DB_TYPE}
      DB_URL: ${DB_URL}

  aggregator-service:
    <<: *default-service
    build: src/aggregator-service
    depends_on:
      - offerservice
    environment:
      OFFER_SERVICE_PROTOCOL: http
      OFFER_SERVICE_HOST: offerservice
      OFFER_SERVICE_PORT: 8080
